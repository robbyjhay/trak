name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: trak
          POSTGRES_PASSWORD: trak_password
          POSTGRES_DB: trak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://trak:trak_password@localhost:5432/trak_test?schema=public
      TRAK_SESSION_SECRET: test_secret_must_be_32_bytes_long_minimum
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          
      - run: npm ci
      
      - run: npm run lint
      
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      
      - run: npx tsc --noEmit
      
      - run: npm run build
      
      - run: npx vitest run
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        
      - name: Run E2E Tests
        run: npx playwright test
